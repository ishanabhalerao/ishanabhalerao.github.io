<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ishan Bhalerao — Finance, Data Science & Product</title>
  <meta name="description" content="Ishan Bhalerao: Finance & Data Science @ Indiana University (Kelley). FinTech product, technical PRDs, and unit economics." />
  <meta name="theme-color" content="#030712" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { -webkit-font-smoothing: antialiased; background: #030712; color: #94a3b8; }
    .hero-glow {
      background:
        radial-gradient(600px circle at 20% 0%, rgba(99,102,241,0.16), transparent 60%),
        radial-gradient(500px circle at 85% 10%, rgba(52,211,153,0.09), transparent 60%);
    }
    .glass {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .card:hover { box-shadow: 0 0 0 1px rgba(99,102,241,0.25), 0 10px 40px -12px rgba(99,102,241,0.25); }

    /* Article hover-reveal: headline + month always visible, details appear on hover/focus.
       On touch devices (no hover), details are always shown. */
    .reveal { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows .3s ease, opacity .3s ease; }
    .reveal > div { overflow: hidden; min-height: 0; }
    @media (hover: hover) {
      .reveal { grid-template-rows: 0fr; opacity: 0; }
      .article:hover .reveal,
      .article:focus-within .reveal { grid-template-rows: 1fr; opacity: 1; }
    }
  </style>
</head>
